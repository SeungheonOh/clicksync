services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.12.3
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-clicksync}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CLICKHOUSE_HTTP_BIND:-127.0.0.1}:8123:8123"
      - "${CLICKHOUSE_NATIVE_BIND:-127.0.0.1}:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  # Optional sidecar for an already-running cardano-node. The directory must
  # contain node.socket. Start with: docker compose --profile ogmios up -d
  ogmios:
    profiles: ["ogmios", "full"]
    image: cardanosolutions/ogmios:v7.0.0
    restart: unless-stopped
    command:
      - --node-socket
      - /ipc/node.socket
      - --node-config
      - /config/${CARDANO_NETWORK:-mainnet}/cardano-node/config.json
      - --host
      - 0.0.0.0
    ports:
      - "${OGMIOS_BIND:-127.0.0.1}:1337:1337"
    volumes:
      - ${CARDANO_NODE_SOCKET_DIR:-./ipc}:/ipc:ro

  clicksync:
    profiles: ["full"]
    build: .
    restart: "on-failure:5"
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      OGMIOS_HOST: ogmios
      OGMIOS_PORT: "1337"
      OGMIOS_TLS: "false"
      LOG_PRETTY: "false"
    depends_on:
      clickhouse:
        condition: service_healthy
      ogmios:
        condition: service_started

volumes:
  clickhouse-data:
  clickhouse-logs:
