name: clicksync

services:
  clickhouse:
    image: clickhouse/clickhouse-server@sha256:1f7cd090d5c4e2b8bfe0ea5d8ae6125937e1d932c6371b4d25fbd6088829dc9c
    container_name: clicksync-clickhouse
    restart: "no"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18125}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
      - ./config/clickhouse-logger.xml:/etc/clickhouse-server/config.d/clicksync-logger.xml:ro
    networks:
      - clicksync
    labels:
      io.clicksync.scope: clicksync
      io.clicksync.kind: database
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'"]
      interval: 2s
      timeout: 2s
      retries: 30
    cpus: 2
    mem_limit: 3g
    pids_limit: 2048
    logging:
      driver: none

  clicksync:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CLICKSYNC_BUILD_ID: ${CLICKSYNC_BUILD_ID:?set CLICKSYNC_BUILD_ID to the frozen source commit/hash}
    image: clicksync:local
    container_name: clicksync
    deploy:
      replicas: 1
    restart: "no"
    init: true
    depends_on:
      clickhouse:
        condition: service_healthy
    command: ["sync"]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_NATIVE_PORT: "9000"
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:?set CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DATABASE: clicksync
      CARDANO_NETWORK_NAME: ${CARDANO_NETWORK_NAME:-mainnet}
      CARDANO_NETWORK_MAGIC: ${CARDANO_NETWORK_MAGIC:-764824073}
      CARDANO_PEERS: ${CARDANO_PEERS:-backbone.cardano.iog.io:3001|iog,backbone.mainnet.cardanofoundation.org:3001|cardano-foundation}
      CARDANO_CORROBORATION: ${CARDANO_CORROBORATION:-2}
      CLICKSYNC_START: ${CLICKSYNC_START:-intersection}
      CLICKSYNC_START_POINT: ${CLICKSYNC_START_POINT:-193253841:e98663bea810a45b59bf2783e40dbd2c69f79e1594b4cd0e160646a3f587eb13}
      CLICKSYNC_QUEUE_CAPACITY: ${CLICKSYNC_QUEUE_CAPACITY:-4}
      CLICKSYNC_HEADER_BATCH_SIZE: ${CLICKSYNC_HEADER_BATCH_SIZE:-32}
      CLICKSYNC_LOCK_PATH: /var/lib/clicksync-state/writer.lock
      CLICKSYNC_WRITER_COORDINATION: single-host-flock
    volumes:
      - clicksync-state:/var/lib/clicksync-state
    networks:
      - clicksync
    labels:
      io.clicksync.scope: clicksync
      io.clicksync.kind: ingestion
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"

networks:
  clicksync:
    name: clicksync
    labels:
      io.clicksync.scope: clicksync

volumes:
  clickhouse-data:
    name: clicksync-data
    labels:
      io.clicksync.scope: clicksync
      io.clicksync.kind: data
  clickhouse-logs:
    name: clicksync-logs
    labels:
      io.clicksync.scope: clicksync
      io.clicksync.kind: logs
  clicksync-state:
    name: clicksync-state
    labels:
      io.clicksync.scope: clicksync
      io.clicksync.kind: writer-coordination
